name: Dashboard benchmarks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Verify real exported metrics and edge cases
        run: npm test
