<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">German Pathology AI report wireframe</title>
  <desc id="desc">One-page report arrangement. Labels only, no model results or simulated data.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#19324D;font-size:17px}
    .h{font-size:27px;font-weight:bold}.s{font-size:14px;fill:#536576}
    .label{font-size:19px;font-weight:bold}.box{fill:#fff;stroke:#D6DFE7}
    .fixed{fill:#F3F7FA;stroke:#D6DFE7}.explore{fill:#F8F5F1;stroke:#D6DFE7}
  </style>
  <rect width="1440" height="1080" fill="#FAFBFC"/>
  <text x="36" y="43" class="h">German Pathology AI — Model Evaluation Dashboard</text>
  <text x="36" y="73" class="s">Frozen ResNet-18 + logistic regression · Independent CRC-VAL-HE-7K · Patch-level research evaluation</text>
  <text x="36" y="98" class="s">Kather, Halama &amp; Marx (2018) · Zenodo 10.5281/zenodo.1214456 · Heidelberg / Mannheim · CC BY 4.0</text>
  <rect x="36" y="120" width="327" height="108" rx="4" class="fixed"/>
  <rect x="383" y="120" width="327" height="108" rx="4" class="fixed"/>
  <rect x="730" y="120" width="327" height="108" rx="4" class="fixed"/>
  <rect x="1077" y="120" width="327" height="108" rx="4" class="explore"/>
  <text x="53" y="150">Evaluated image patches</text><text x="53" y="202" class="s">Fixed benchmark count</text>
  <text x="400" y="150">Accuracy</text><text x="400" y="202" class="s">Fixed benchmark</text>
  <text x="747" y="150">Macro F1</text><text x="747" y="202" class="s">Fixed nine classes</text>
  <text x="1094" y="150">TUM sensitivity</text><text x="1094" y="202" class="s">Exploratory tumour threshold</text>
  <rect x="36" y="248" width="674" height="438" rx="4" class="box"/>
  <text x="56" y="282" class="label">Nine-class confusion matrix</text>
  <text x="56" y="313" class="s">Rows: true tissue · Columns: predicted tissue</text>
  <text x="56" y="342" class="s">Nine × nine image counts, including zeros</text>
  <rect x="125" y="366" width="468" height="260" fill="#F3F7FA" stroke="#D6DFE7"/>
  <text x="200" y="489">Counts generated by the actual run</text>
  <text x="56" y="660" class="s">Verify all counts and the grand total against the exported matrix.</text>
  <rect x="730" y="248" width="674" height="208" rx="4" class="box"/>
  <text x="750" y="282" class="label">Recall by tissue class</text>
  <text x="750" y="318" class="s">Horizontal bars · German labels · Percentage axis</text>
  <text x="750" y="356" class="s">Tooltips: precision, F1, true-class support</text>
  <text x="750" y="415" class="s">Class metrics use all predicted classes in their denominators.</text>
  <rect x="730" y="476" width="674" height="210" rx="4" class="box"/>
  <text x="750" y="510" class="label">Confidence distribution</text>
  <text x="750" y="548" class="s">Ten bins · Stacked counts: correct / incorrect</text>
  <rect x="751" y="574" width="13" height="13" fill="#376B97"/>
  <text x="773" y="586" class="s">Correct</text>
  <rect x="876" y="574" width="13" height="13" fill="#B85B45"/>
  <text x="898" y="586" class="s">Incorrect</text>
  <text x="750" y="630" class="s">High-confidence errors: count and rate at fixed confidence ≥ 0.90</text>
  <rect x="36" y="706" width="674" height="172" rx="4" class="explore"/>
  <text x="56" y="740" class="label">Exploratory review confidence cutoff</text>
  <text x="56" y="778">Single-select dropdown · Default 0.80</text>
  <text x="56" y="816" class="s">Flagged count / proportion · Retained coverage · Retained accuracy</text>
  <text x="56" y="849" class="s">Flag confidence below cutoff; original multiclass prediction stays fixed.</text>
  <rect x="730" y="706" width="674" height="172" rx="4" class="explore"/>
  <text x="750" y="740" class="label">Exploratory tumour probability threshold</text>
  <text x="750" y="778">Separate dropdown · Default 0.50</text>
  <text x="750" y="816" class="s">Sensitivity · Specificity · Precision</text>
  <text x="750" y="849" class="s">TUM if p_TUM ≥ threshold; negative category: other tissue classes.</text>
  <rect x="36" y="898" width="1368" height="114" rx="4" class="box"/>
  <text x="56" y="931" class="label">Error table — visual-only is_correct = 0 filter</text>
  <text x="56" y="973" class="s">Image ID | True class | Predicted class | Confidence · Sort by confidence descending · Scroll for rows</text>
  <text x="36" y="1044" class="s">Wireframe only: no results shown. Fixed benchmark cards and exploratory controls are labelled separately.</text>
  <text x="36" y="1067" class="s">Run hash in final report footer · No clinical validation · Patches within a patient are correlated</text>
</svg>
